<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d26"><title>Convite | Igreja Pentecostal Unidos em Um</title><link rel="stylesheet" href="assets/css/style.css"><style>
.public-invite{max-width:850px;margin:38px auto;padding:0 18px}.invite-shell{background:#fffefa;border:1px solid #e5ddd2;border-radius:16px;padding:24px;box-shadow:0 12px 35px #39271912}.public-paper{background:#fff;border:1px solid #e5ddd2;padding:38px 42px;text-align:center;font:14px/1.7 Georgia,serif;color:#24211e}.public-paper header{border-bottom:2px solid #9a7444;padding-bottom:15px;margin-bottom:22px}.public-paper img{width:68px;height:68px;object-fit:contain}.public-paper h2{font:700 19px Georgia,serif;color:#4b3525;margin:7px 0 3px}.public-paper h1{font:bold 18px Georgia,serif;color:#513b2b;margin:18px 0}.public-paper p{margin:0 0 13px}.public-paper .theme{font-weight:bold}.public-paper ol{display:table;margin:5px auto 20px;text-align:left}.public-paper footer{border-top:1px solid #d8c8b4;margin-top:28px;padding-top:10px;font:9px Arial,sans-serif;color:#786653}.confirm-box{max-width:520px;margin:25px auto 0;padding:22px;background:#f8f2e9;border:1px solid #eadfd2;border-radius:12px}.confirm-box h2{font:700 22px 'Playfair Display';color:#59412d;margin:0 0 8px}.confirm-box label{display:block;font-weight:700;font-size:12px;margin:12px 0 5px}.confirm-box input{width:100%;padding:11px;border:1px solid #dfcdb6;border-radius:8px;background:white}.confirm-box button{margin-top:16px;width:100%}.status{text-align:center;margin-top:12px;font-size:13px}.hidden{display:none!important}@media(max-width:600px){.public-invite{margin:18px auto;padding:0 10px}.invite-shell{padding:12px}.public-paper{padding:24px 15px;font-size:12px}.public-paper h2{font-size:16px}.public-paper h1{font-size:16px}}
</style></head><body><main class="public-invite"><div class="invite-shell"><article id="public-letter" class="public-paper"><p>Carregando convite...</p></article><section id="confirm-section" class="confirm-box hidden"><h2>Confirme sua presença</h2><p>Será uma alegria receber vocês! Informe os dados abaixo para registrar a confirmação.</p><form id="confirm-form"><label for="person-name">Seu nome *</label><input id="person-name" maxlength="100" required placeholder="Nome de quem está confirmando"><label for="ministry-name">Ministério / Igreja *</label><input id="ministry-name" maxlength="120" required placeholder="Nome do ministério ou igreja"><label for="group-name">Grupo *</label><input id="group-name" maxlength="120" required placeholder="Ex.: Grupo de jovens, círculo de oração..."><button class="primary-btn" type="submit">Confirmar presença</button></form><p id="confirm-status" class="status" role="status"></p></section><p id="invalid-invite" class="status hidden">Este convite não foi encontrado ou não está mais disponível.</p></div></main><script type="module" src="assets/js/convite-publico.js?v=20261127-1"></script></body></html>
